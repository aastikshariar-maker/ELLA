[tool.poetry]
name = "ai-cofounder"
version = "0.1.0"
description = "AI-powered co-founder platform for strategic business management"
authors = ["AI Co-Founder Team"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/aastikshariar-maker/ai-cofounder"

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.104.1"
uvicorn = {version = "^0.24.0", extras = ["standard"]}
pydantic = "^2.5.0"
pydantic-settings = "^2.1.0"
sqlalchemy = "^2.0.23"
alembic = "^1.13.1"
psycopg2-binary = "^2.9.9"
celery = "^5.3.4"
redis = "^5.0.1"
openai = "^1.3.8"
tenacity = "^8.2.3"
langchain = "^0.1.0"
pandas = "^2.1.3"
numpy = "^1.26.2"
scipy = "^1.11.4"
scikit-learn = "^1.3.2"
streamlit = "^1.29.0"
plotly = "^5.18.0"
matplotlib = "^3.8.2"
requests = "^2.31.0"
httpx = "^0.25.2"
python-jose = {version = "^3.3.0", extras = ["cryptography"]}
passlib = {version = "^1.7.4", extras = ["bcrypt"]}
python-dotenv = "^1.0.0"
pyyaml = "^6.0.1"
click = "^8.1.7"
loguru = "^0.7.2"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-cov = "^4.1.0"
pytest-asyncio = "^0.21.1"
faker = "^20.1.0"
black = "^23.12.0"
flake8 = "^6.1.0"
isort = "^5.13.2"
mypy = "^1.7.1"
pre-commit = "^3.5.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
